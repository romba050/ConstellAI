[project]
name = "constellai"
version = "0.1.0"
description = "ConstellAI - an AI atlas for the world's rare diseases"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.13",
    "igraph>=0.11",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "umap-learn>=0.5.12",
]

[tool.uv]
package = false
