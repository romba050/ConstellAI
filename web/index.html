<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConstellAI — an atlas for the world's rare diseases</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <a class="brand" href="#">
    <svg class="brand-mark" viewBox="424 337 199 191" width="26" height="26" aria-hidden="true"><image href="/branding/brand-board.png" width="1920" height="1080"/></svg>
    <span>Constell<span class="brand-ai">AI</span></span>
  </a>
  <a href="/" class="research-return">Therapeutic research ↗</a>
  <div class="search">
    <input id="q" type="search" autocomplete="off" spellcheck="false"
           placeholder="Search a disease, gene, symptom, mechanism or patient group — e.g. “STXBP1” or “lysosomal”">
    <div id="hits" hidden></div>
  </div>
  <p class="audience-label"><strong>Maria</strong><span>· Patient organisation</span></p>
</header>
<main>
  <aside id="legend"></aside>
  <section id="mapwrap">
    <canvas id="map"></canvas>
    <div id="tip" hidden></div>
    <div class="mapkey">
      <span><i class="line"></i> same constellation</span>
      <span><i class="line dashed"></i> bridge across constellations</span>
      <button id="reset">Reset view</button>
    </div>
  </section>
  <aside id="panel"></aside>
</main>
<footer class="atlas-footer"><span>Buffalo challenge · OpenAI integration</span><span class="partner-art" aria-hidden="true"><svg class="partner-openai" viewBox="681 436 391 83" width="75" height="16"><image href="/branding/brand-board.png" width="1920" height="1080"/></svg><svg class="partner-buffalo" viewBox="1100 353 428 246" width="39" height="23"><image href="/branding/brand-board.png" width="1920" height="1080"/></svg></span></footer>
<div id="modal" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <strong>Sourced proposal</strong>
      <span>
        <button id="copy">Copy</button>
        <button id="download">Download .md</button>
        <button id="close">Close</button>
      </span>
    </div>
    <pre id="brief"></pre>
  </div>
</div>
<script src="/vendor/d3.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
